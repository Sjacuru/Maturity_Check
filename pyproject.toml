[project]
name = "maturity-check"
version = "0.1.0"
description = "PPP Maturity Check System — IPMP-based evaluation of procurement documents."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "numpy>=1.26",
  "lancedb>=0.17",
  "sentence-transformers>=3.0",
  "groq>=0.9",
  "httpx>=0.27",
  "rapidfuzz>=3.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
