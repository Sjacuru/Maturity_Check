[project]
name = "maturity-check"
version = "0.1.0"
description = "PPP Maturity Check System — IPMP-based evaluation of procurement documents."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pypdf>=6.0",
  "unstructured[pdf]>=0.22",
  "numpy>=1.26",
  "lancedb>=0.17",
  "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
